<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Programs</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background-color: #242424;
            }
            h1 {
                text-align: center;
                color: aliceblue;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(220px, 1fr));
                max-width: 1000px;
                margin: auto;
                gap: 20px;
            }
            .card {
                transition: transform 0.2s ease;
                padding: 1px 20px;
                border-radius: 10px;
                background-color: #504f4f;
            }
            .card:hover {
                transform: scale(1.03);
            }
            .card a {
                color: azure;
                text-decoration: none;
                
            }
            .card p {
                color: #1f1f1f;
            }
            .git-card {
                transition: transform 0.2s ease;
                padding: 1px 20px;
                border-radius: 10px;
                background-color: #4e57a4;
            }
            .git-card:hover {
                transform: scale(1.03);
            }
            .git-card a {
                color: azure;
                text-decoration: none;
                
            }
            .git-card p {
                color: #1f1f1f;
            }
        </style>
    </head>
    <body>
        <h1>My Websites</h1>
        <div class="grid">
            <div class="card">
                <a href="https://shrawil.github.io/fitness-tracker/" target="_blank">
                    <h2>Fitness Tracker</h2>
                    <p>Click to open</p>
                </a>
            </div>
            <div class="card">
                <a href="https://shrawil.github.io/ID-Card-Generator/" target="_blank">
                    <h2>ID Card Generator</h2>
                    <p>Click to open</p>
                </a>
            </div>
            <div class="card">
                <a href="https://shrawil.github.io/ResumeMaker/" target="_blank">
                    <h2>Resume Maker</h2>
                    <p>Click to open</p>
                </a>
            </div>
            <div class="card">
                <a href="https://shrawil.github.io/GuessTheImposter/" target="_blank">
                    <h2>Guess The Imposter</h2>
                    <p>Click to open</p>
                </a>
            </div>
            <div class="card">
                <a href="https://shrawil.github.io/banking-simulator/" target="_blank">
                    <h2>Banking Simulator</h2>
                    <p>Click to open</p>
                </a>
            </div>
            <div class="card">
                <a href="https://shrawil.github.io/simple-quiz-program/" target="_blank">
                    <h2>Simple Quiz</h2>
                    <p>Click to open</p>
                </a>
            </div>
            <div class="card">
                <a href="https://shrawil.github.io/Countdown/" target="_blank">
                    <h2>Countdown</h2>
                    <p>Click to open</p>
                </a>
            </div>
            <div class="git-card">
                <a href="https://github.com/Shrawil" target="_blank">
                    <h2>My Github</h2>
                    <p>Click to open</p>
                </a>
            </div>
            
        </div>
    </body>
</html>
